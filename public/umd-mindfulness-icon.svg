<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="5 10 96 60" role="img" aria-labelledby="title desc">
  <title id="title">Mindfulness Society lotus and person icon</title>
  <desc id="desc">An abstract seated figure with upward sweeping arms, surrounded by four open lotus leaves, transitioning from golden orange on the left to fresh green on the right.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F4B64F"/>
      <stop offset="1" stop-color="#FBC668"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#EFB04B"/>
      <stop offset="1" stop-color="#F7C261"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88D858"/>
      <stop offset="1" stop-color="#6BCB4A"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BCF54"/>
      <stop offset="1" stop-color="#8CD85B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#81D055"/>
      <stop offset="0.55" stop-color="#7DCF52"/>
      <stop offset="1" stop-color="#71C950"/>
    </linearGradient>
  </defs>

  <!-- Upper-left open lotus leaf -->
  <path fill="url(#gold)" d="M 16.6,29.8 C 30.8,28.5 43.7,33.5 49.6,41.0 C 38.2,33.5 27.3,31.2 20.2,31.9 Z"/>
  <path fill="url(#gold)" d="M 16.6,29.8 C 21.5,40.0 33.1,46.4 47.6,49.8 C 34.5,48.9 21.8,41.9 16.6,29.8 Z"/>

  <!-- Lower-left open lotus leaf -->
  <path fill="url(#amber)" d="M 8.4,52.2 C 22.4,44.7 38.1,44.0 47.5,53.2 C 34.0,47.4 20.1,48.5 13.0,53.0 C 25.9,60.3 36.4,59.2 47.0,58.9 C 34.3,62.8 19.2,63.3 8.4,52.2 Z"/>

  <!-- Upper-right open lotus leaf -->
  <path fill="url(#lime)" d="M 57.2,40.8 C 63.6,31.7 76.1,28.1 89.0,29.2 C 76.3,31.2 63.3,35.4 57.2,40.8 Z"/>
  <path fill="url(#green)" d="M 89.0,29.2 C 85.0,39.9 73.3,46.2 59.2,50.4 C 69.9,42.7 82.1,36.3 85.0,32.0 Z"/>

  <!-- Lower-right open lotus leaf -->
  <path fill="url(#lime)" d="M 58.7,53.0 C 70.8,44.9 85.3,44.5 96.6,53.2 C 83.7,49.0 71.4,49.6 58.7,53.0 Z"/>
  <path fill="url(#green)" d="M 96.6,53.2 C 85.9,63.3 72.4,63.6 60.5,59.8 C 75.4,61.6 87.8,59.5 91.9,53.4 Z"/>

  <!-- Raised left arm -->
  <path fill="url(#amber)" d="M 48.1,12.3 C 43.4,18.5 41.0,23.1 43.4,29.5 C 45.4,34.4 48.7,37.3 49.7,41.3 C 45.9,35.2 39.8,31.6 39.4,24.8 C 39.1,20.4 42.9,15.5 48.1,12.3 Z"/>

  <!-- Head -->
  <circle cx="52.8" cy="23.3" r="3.7" fill="#81D254"/>

  <!-- Raised right arm, flowing into the central seated figure -->
  <path fill="url(#body)" d="M 57.3,12.2 C 64.2,17.3 65.2,22.9 62.5,29.8 C 60.2,35.7 54.0,41.7 51.9,49.0 C 49.9,55.7 50.7,61.8 55.8,68.2 C 47.9,61.9 46.8,55.1 48.9,47.6 C 51.1,39.9 57.6,32.0 59.7,25.6 C 61.9,19.4 60.4,15.7 57.3,12.2 Z"/>

  <!-- Gold accent where the petals meet -->
  <path fill="url(#gold)" d="M 55.4,42.5 C 57.6,49.1 57.9,57.2 53.0,64.4 C 51.5,66.6 50.0,68.4 49.4,69.5 C 52.3,60.1 52.9,50.9 55.4,42.5 Z"/>
</svg>
