name: Deploy GitHub Pages client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize private deployment configuration outside the bundle
        env:
          PRIVATE_CONFIG_JSON: ${{ secrets.SCHEDULING_PRIVATE_CONFIG_JSON }}
        run: |
          set -eu
          test -n "$PRIVATE_CONFIG_JSON" || { echo 'SCHEDULING_PRIVATE_CONFIG_JSON is required; refusing deployment.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/scheduling"
          printf '%s' "$PRIVATE_CONFIG_JSON" > "$RUNNER_TEMP/scheduling/production.json"

      - name: Render the safe public configuration
        run: node scripts/render-public-config.mjs --config "$RUNNER_TEMP/scheduling/production.json" --output public/config.json

      - name: Build static client
        run: npm run build:client

      - name: Run fail-closed deployment checks
        run: node scripts/deployment-check.mjs --config "$RUNNER_TEMP/scheduling/production.json" --public-config public/config.json --dist dist/client --report "$RUNNER_TEMP/scheduling/deployment-report.json"

      - name: Upload scrubbed deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: ${{ runner.temp }}/scheduling/deployment-report.json
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
