name: Validate

# Runs on every push and pull request and deploys nothing: no secrets, no Pages
# artifact, no Apps Script push. Deployment lives in pages.yml, which is manual.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and lint
        run: pnpm run check

      - name: Node test suite
        run: pnpm test

      - name: Worker-native test suite
        run: pnpm run test:worker

      - name: Build client and Apps Script bundle
        run: pnpm run build

      - name: Worker dry-run build
        run: pnpm run build:worker

      # Strict OpenSpec validation is a local planning gate: the CLI is not a
      # repository dependency, so CI does not fetch one on every push.
